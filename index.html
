<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الشطرنج</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #312e2b;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 { margin-bottom: 10px; font-size: 24px; }
        #board {
            width: 320px;
            height: 320px;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            border: 4px solid #b58863;
        }
        .square {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            cursor: pointer;
        }
        .light { background-color: #eeeed2; }
        .dark { background-color: #769656; }
        .status { margin-top: 15px; font-size: 16px; }
    </style>
</head>
<body>

    <h1>لعبة الشطرنج</h1>
    <div id="board"></div>
    <div class="status" id="status">دور اللاعب: الأبيض</div>

    <script>
        const boardElement = document.getElementById('board');
        const statusElement = document.getElementById('status');

        const initialBoard = [
            ['♜','♞','♝','♛','♚','♝','♞','♜'],
            ['♟','♟','♟','♟','♟','♟','♟','♟'],
            ['','','','','','','',''],
            ['','','','','','','',''],
            ['','','','','','','',''],
            ['','','','','','','',''],
            ['♙','♙','♙','♙','♙','♙','♙','♙'],
            ['♖','♘','♗','♕','♔','♗','♘','♖']
        ];

        let selectedPiece = null;
        let selectedCoords = null;
        let turn = 'white';

        function renderBoard() {
            boardElement.innerHTML = '';
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const square = document.createElement('div');
                    square.classList.add('square');
                    square.classList.add((r + c) % 2 === 0 ? 'light' : 'dark');
                    square.textContent = initialBoard[r][c];
                    square.dataset.row = r;
                    square.dataset.col = c;
                    
                    square.addEventListener('click', () => handleSquareClick(r, c));
                    boardElement.appendChild(square);
                }
            }
        }

        function handleSquareClick(r, c) {
            const piece = initialBoard[r][c];
            if (selectedPiece) {
                initialBoard[r][c] = selectedPiece;
                initialBoard[selectedCoords.r][selectedCoords.c] = '';
                selectedPiece = null;
                selectedCoords = null;
                turn = turn === 'white' ? 'black' : 'white';
                statusElement.textContent = `دور اللاعب: ${turn === 'white' ? 'الأبيض' : 'الأسود'}`;
                renderBoard();
            } else if (piece !== '') {
                selectedPiece = piece;
                selectedCoords = { r, c };
            }
        }

        renderBoard();
    </script>
</body>
</html>
